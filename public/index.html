<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo · Cloud Agent demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Todos</h1>
        <p class="subtitle">A tiny app to prove the dev environment runs end to end.</p>
      </header>

      <form id="new-todo-form" class="new-todo">
        <input
          id="new-todo-input"
          name="title"
          type="text"
          placeholder="What needs doing?"
          autocomplete="off"
          required
        />
        <button type="submit">Add</button>
      </form>

      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty-state" class="empty" hidden>Nothing here yet — add your first todo.</p>
    </main>

    <script src="app.js" type="module"></script>
  </body>
</html>
